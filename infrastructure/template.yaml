AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS X-Ray example - basic todo app

Parameters:
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH into the web server, for example 203.0.113.5/32. Set it in samconfig.toml.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the load balancer and the Fargate tasks. Use the default VPC. Set it in samconfig.toml.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different availability zones, with a route to the internet. Set it in samconfig.toml.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TodosTable
  Api:
    TracingEnabled: true

Resources:
  TodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from anywhere for the Apache landing page, SSH from one CIDR
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr

  # Private bucket. scripts/deploy-ec2.sh uploads ec2-app.tgz here and the instance pulls it.
  AppArtifactsBucket:
    Type: AWS::S3::Bucket

  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the X-Ray daemon send segments (xray:PutTraceSegments).
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        # Lets deploy-ec2.sh restart the app with SSM Run Command, no SSH needed.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: todos-table-delete
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt TodosTable.Arn
        - PolicyName: read-app-artifact
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${AppArtifactsBucket.Arn}/*"

  WebServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebServerRole]

  # UserData runs only on first boot. Rename this ID when UserData changes, to force a new instance.
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      SecurityGroupIds: [!GetAtt WebServerSecurityGroup.GroupId]
      IamInstanceProfile: !Ref WebServerProfile
      Tags:
        - { Key: Name, Value: xray-example-web }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex

          # t4g.nano has 0.5 GB RAM. dnf and npm are killed by the OOM killer without swap.
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile

          dnf install -y nodejs24 || dnf install -y nodejs

          # Tools for logging in over SSH.
          dnf install -y tmux

          # X-Ray daemon: receives segments from the app on 127.0.0.1:2000 and sends them to X-Ray.
          curl -o /tmp/xray.rpm https://s3.us-east-2.amazonaws.com/aws-xray-assets.us-east-2/xray-daemon/aws-xray-daemon-arm64-3.x.rpm
          dnf install -y /tmp/xray.rpm
          systemctl enable --now xray

          # App: pulled from S3 on every start. Until deploy-ec2.sh uploads it, the service retries.
          mkdir -p /opt/todos-ec2
          cat > /usr/local/bin/pull-app.sh <<'EOF'
          #!/bin/bash
          set -e
          aws s3 cp s3://${AppArtifactsBucket}/ec2-app.tgz /tmp/ec2-app.tgz --region ${AWS::Region}
          tar -xzf /tmp/ec2-app.tgz -C /opt/todos-ec2
          cd /opt/todos-ec2
          npm install --omit=dev
          EOF
          chmod +x /usr/local/bin/pull-app.sh

          cat > /etc/systemd/system/todos-ec2.service <<'EOF'
          [Unit]
          Description=Todos EC2 app
          After=network-online.target xray.service

          [Service]
          WorkingDirectory=/opt/todos-ec2
          Environment=TABLE_NAME=${TodosTable}
          Environment=AWS_REGION=${AWS::Region}
          ExecStartPre=/usr/local/bin/pull-app.sh
          ExecStart=/usr/bin/node /opt/todos-ec2/server.js
          Restart=always
          RestartSec=15

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now todos-ec2

  # A fixed address for the instance. API Gateway needs a URL that does not change
  # when the instance is replaced, because the deployment is not redone for it.
  WebServerEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  WebServerEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref WebServerInstance
      AllocationId: !GetAtt WebServerEip.AllocationId

  # Fargate: the Update feature. PATCH /todos/{id} goes API Gateway -> ALB -> container.
  # Fargate gives every task a new IP, so the ALB is the fixed address API Gateway calls.
  EcsRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      EmptyOnDelete: true

  EcsCluster:
    Type: AWS::ECS::Cluster

  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  EcsAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from anywhere to the ECS load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  EcsTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Container port, only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !GetAtt EcsAlbSecurityGroup.GroupId }

  EcsAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!GetAtt EcsAlbSecurityGroup.GroupId]

  EcsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }

  EcsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EcsAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref EcsTargetGroup }

  # Pulls the image from ECR and writes container logs. Not the app's role.
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # The app's role, also used by the daemon sidecar in the same task.
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the daemon sidecar send segments (xray:PutTraceSegments).
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: todos-table-update
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt TodosTable.Arn

  # Two containers in one task. They share the network, so the app reaches the daemon on 127.0.0.1:2000.
  # The daemon needs xray:PutTraceSegments: EcsTaskRole has AWSXRayDaemonWriteAccess.
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: xray-example-todos
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: todos
          Image: !Sub "${EcsRepository.RepositoryUri}:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - { Name: TABLE_NAME, Value: !Ref TodosTable }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: todos
        # Sidecar: receives segments from the app on UDP 2000 and sends them to X-Ray.
        # -o is local mode: do not call the EC2 metadata service, which does not exist on Fargate.
        # Not essential: a daemon crash must not stop the todos container.
        - Name: xray-daemon
          Image: public.ecr.aws/xray/aws-xray-daemon:latest
          Essential: false
          Cpu: 32
          MemoryReservation: 64
          Command: ["-o"]
          PortMappings:
            - ContainerPort: 2000
              Protocol: udp
          Environment:
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: xray-daemon

  # DesiredCount is 0 because the repository is empty on the first deploy.
  # scripts/deploy-ecs.sh pushes the image and sets it to 1.
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: EcsListener
    Properties:
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: 0
      TaskDefinition: !Ref EcsTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!GetAtt EcsTaskSecurityGroup.GroupId]
      LoadBalancers:
        - { ContainerName: todos, ContainerPort: 8080, TargetGroupArn: !Ref EcsTargetGroup }

  # One API for everything. With an explicit DefinitionBody, SAM adds the CORS
  # OPTIONS routes and the Lambda permissions, but not the integrations: every
  # route declares its own. GET and POST /todos go to the Lambda. GET / and
  # DELETE /todos/{id} go to the instance. PATCH /todos/{id} goes to the ALB.
  TodosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: xray-example-app
          version: "1.0"
        paths:
          /:
            get:
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: GET
                uri: !Sub "http://${WebServerEip}/"
          /todos:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TodosFunction.Arn}/invocations"
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TodosFunction.Arn}/invocations"
          /todos/{id}:
            delete:
              parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: string }
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: DELETE
                uri: !Sub "http://${WebServerEip}/todos/{id}"
                requestParameters:
                  integration.request.path.id: method.request.path.id
            patch:
              parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: string }
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: PATCH
                uri: !Sub "http://${EcsAlb.DNSName}/todos/{id}"
                requestParameters:
                  integration.request.path.id: method.request.path.id

  TodosFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      CodeUri: ../apps/lambda-todos
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Events:
        List:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: get }
        Create:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: post }

Outputs:
  ApiUrl:
    Description: API Gateway base URL. /todos goes to the Lambda, DELETE /todos/{id} and / go to EC2. Put it in apps/frontend/.env as VITE_API_URL
    Value: !Sub "https://${TodosApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  FrontendBucketName:
    Description: S3 bucket that holds the built frontend
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Description: Public URL of the frontend (S3 website endpoint, HTTP only)
    Value: !GetAtt FrontendBucket.WebsiteURL
  TableName:
    Description: DynamoDB table name. The EC2 app reads it from TABLE_NAME.
    Value: !Ref TodosTable
  AppArtifactsBucketName:
    Description: Private bucket for the EC2 app tarball (used by scripts/deploy-ec2.sh)
    Value: !Ref AppArtifactsBucket
  WebServerInstanceId:
    Description: EC2 instance id (used by scripts/deploy-ec2.sh)
    Value: !Ref WebServerInstance
  EcsRepositoryUri:
    Description: ECR repository for the ECS app image (used by scripts/deploy-ecs.sh)
    Value: !GetAtt EcsRepository.RepositoryUri
  EcsClusterName:
    Description: ECS cluster name (used by scripts/deploy-ecs.sh)
    Value: !Ref EcsCluster
  EcsServiceName:
    Description: ECS service name (used by scripts/deploy-ecs.sh)
    Value: !GetAtt EcsService.Name
