AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS X-Ray example - basic todo app

Parameters:
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH into the web server, for example 203.0.113.5/32. Set it in samconfig.toml.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TodosTable
  Api:
    TracingEnabled: true

Resources:
  TodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from anywhere for the Apache landing page, SSH from one CIDR
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr

  # Private bucket. scripts/deploy-ec2.sh uploads ec2-app.tgz here and the instance pulls it.
  AppArtifactsBucket:
    Type: AWS::S3::Bucket

  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the X-Ray daemon send segments (xray:PutTraceSegments).
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        # Lets deploy-ec2.sh restart the app with SSM Run Command, no SSH needed.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: todos-table-delete
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt TodosTable.Arn
        - PolicyName: read-app-artifact
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${AppArtifactsBucket.Arn}/*"

  WebServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebServerRole]

  # UserData runs only on first boot. Rename this ID when UserData changes, to force a new instance.
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      SecurityGroupIds: [!GetAtt WebServerSecurityGroup.GroupId]
      IamInstanceProfile: !Ref WebServerProfile
      Tags:
        - { Key: Name, Value: xray-example-web }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex

          # t4g.nano has 0.5 GB RAM. dnf and npm are killed by the OOM killer without swap.
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile

          dnf install -y nodejs24 || dnf install -y nodejs

          # Tools for logging in over SSH.
          dnf install -y tmux

          # X-Ray daemon: receives segments from the app on 127.0.0.1:2000 and sends them to X-Ray.
          curl -o /tmp/xray.rpm https://s3.us-east-2.amazonaws.com/aws-xray-assets.us-east-2/xray-daemon/aws-xray-daemon-arm64-3.x.rpm
          dnf install -y /tmp/xray.rpm
          systemctl enable --now xray

          # App: pulled from S3 on every start. Until deploy-ec2.sh uploads it, the service retries.
          mkdir -p /opt/todos-ec2
          cat > /usr/local/bin/pull-app.sh <<'EOF'
          #!/bin/bash
          set -e
          aws s3 cp s3://${AppArtifactsBucket}/ec2-app.tgz /tmp/ec2-app.tgz --region ${AWS::Region}
          tar -xzf /tmp/ec2-app.tgz -C /opt/todos-ec2
          cd /opt/todos-ec2
          npm install --omit=dev
          EOF
          chmod +x /usr/local/bin/pull-app.sh

          cat > /etc/systemd/system/todos-ec2.service <<'EOF'
          [Unit]
          Description=Todos EC2 app
          After=network-online.target xray.service

          [Service]
          WorkingDirectory=/opt/todos-ec2
          Environment=TABLE_NAME=${TodosTable}
          Environment=AWS_REGION=${AWS::Region}
          ExecStartPre=/usr/local/bin/pull-app.sh
          ExecStart=/usr/bin/node /opt/todos-ec2/server.js
          Restart=always
          RestartSec=15

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now todos-ec2

  WebApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: xray-example-web

  WebRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !GetAtt WebApi.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        Uri: !Sub "http://${WebServerInstance.PublicDnsName}/"

  WebTodosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WebApi
      ParentId: !GetAtt WebApi.RootResourceId
      PathPart: todos

  WebTodoIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WebApi
      ParentId: !Ref WebTodosResource
      PathPart: "{id}"

  # ANY covers DELETE and the browser's OPTIONS preflight. The EC2 app answers both.
  WebTodoIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !Ref WebTodoIdResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub "http://${WebServerInstance.PublicDnsName}/todos/{id}"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # A raw Deployment is not redeployed when methods change. Rename this ID
  # (V2, V3, ...) to force a new deployment.
  WebDeploymentV3:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [WebRootMethod, WebTodoIdMethod]
    Properties:
      RestApiId: !Ref WebApi

  WebStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref WebApi
      DeploymentId: !Ref WebDeploymentV3
      StageName: Prod
      TracingEnabled: true

  TodosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"

  TodosFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      CodeUri: ../apps/lambda-todos
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Events:
        List:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: get }
        Create:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: post }

Outputs:
  ApiUrl:
    Description: API Gateway base URL (put in apps/frontend/.env as VITE_API_URL)
    Value: !Sub "https://${TodosApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  FrontendBucketName:
    Description: S3 bucket that holds the built frontend
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Description: Public URL of the frontend (S3 website endpoint, HTTP only)
    Value: !GetAtt FrontendBucket.WebsiteURL
  WebUrl:
    Description: Apache landing page on EC2, through its own API Gateway (a second URL)
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: DynamoDB table name. The EC2 app reads it from TABLE_NAME.
    Value: !Ref TodosTable
  AppArtifactsBucketName:
    Description: Private bucket for the EC2 app tarball (used by scripts/deploy-ec2.sh)
    Value: !Ref AppArtifactsBucket
  WebServerInstanceId:
    Description: EC2 instance id (used by scripts/deploy-ec2.sh)
    Value: !Ref WebServerInstance
