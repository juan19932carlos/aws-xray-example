AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS X-Ray example - basic todo app

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TodosTable
  Api:
    TracingEnabled: true

Resources:
  TodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  TodosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"

  TodosFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      CodeUri: ../packages/backend
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Events:
        List:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: get }
        Create:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: post }

Outputs:
  ApiUrl:
    Description: API Gateway base URL (put in packages/frontend/.env as VITE_API_URL)
    Value: !Sub "https://${TodosApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  FrontendBucketName:
    Description: S3 bucket that holds the built frontend
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Description: Public URL of the frontend (S3 website endpoint, HTTP only)
    Value: !GetAtt FrontendBucket.WebsiteURL
