AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS X-Ray example - basic todo app

Parameters:
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH into the web server, for example 203.0.113.5/32. Set it in samconfig.toml.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TodosTable
  Api:
    TracingEnabled: true

Resources:
  TodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from anywhere for the Apache landing page, SSH from one CIDR
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr

  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: todos-table-delete
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt TodosTable.Arn

  WebServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebServerRole]

  WebServerHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      SecurityGroupIds: [!GetAtt WebServerSecurityGroup.GroupId]
      IamInstanceProfile: !Ref WebServerProfile
      Tags:
        - { Key: Name, Value: xray-example-web }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # t4g.nano has 0.5 GB RAM. dnf is killed by the OOM killer without swap.
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          dnf install -y httpd
          echo "<h1>Hello from EC2 (Apache)</h1>" > /var/www/html/index.html
          systemctl enable --now httpd

  WebApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: xray-example-web

  WebRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !GetAtt WebApi.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        Uri: !Sub "http://${WebServerHost.PublicDnsName}/"

  WebTodosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WebApi
      ParentId: !GetAtt WebApi.RootResourceId
      PathPart: todos

  WebTodoIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WebApi
      ParentId: !Ref WebTodosResource
      PathPart: "{id}"

  # ANY covers DELETE and the browser's OPTIONS preflight. The EC2 app answers both.
  WebTodoIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !Ref WebTodoIdResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub "http://${WebServerHost.PublicDnsName}/todos/{id}"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # A raw Deployment is not redeployed when methods change. Rename this ID
  # (V2, V3, ...) to force a new deployment.
  WebDeploymentV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [WebRootMethod, WebTodoIdMethod]
    Properties:
      RestApiId: !Ref WebApi

  WebStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref WebApi
      DeploymentId: !Ref WebDeploymentV2
      StageName: Prod
      TracingEnabled: true

  TodosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"

  TodosFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      CodeUri: ../apps/lambda-todos
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Events:
        List:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: get }
        Create:
          Type: Api
          Properties: { RestApiId: !Ref TodosApi, Path: /todos, Method: post }

Outputs:
  ApiUrl:
    Description: API Gateway base URL (put in apps/frontend/.env as VITE_API_URL)
    Value: !Sub "https://${TodosApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  FrontendBucketName:
    Description: S3 bucket that holds the built frontend
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Description: Public URL of the frontend (S3 website endpoint, HTTP only)
    Value: !GetAtt FrontendBucket.WebsiteURL
  WebUrl:
    Description: Apache landing page on EC2, through its own API Gateway (a second URL)
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: DynamoDB table name. The EC2 app reads it from TABLE_NAME.
    Value: !Ref TodosTable
